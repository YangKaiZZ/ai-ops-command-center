# Arbiter Ops on one server. Caddy takes the public traffic (and
# gets the HTTPS certificate): /api/* goes to the backend, everything else to
# the dashboard. Settings come from .env next to this file (see .env.example).
name: ai-ops

# Docker keeps container logs forever by default; cap them so they can't fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_ops
      MYSQL_USER: aiops
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    # Just the empty ai_ops database: the backend's migrations create and
    # update the tables each time it starts.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Over TCP on purpose: during first-time setup MySQL runs without
      # networking, so this only passes once the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *logging

  backend:
    build:
      context: ../backend
      additional_contexts:
        mcp: ../mcp # the agent runs the MCP server inside this container
    restart: unless-stopped
    # On a restart the backend lets running jobs (agent runs) finish for up to
    # 25s; anything cut off is queued again when it starts.
    stop_grace_period: 30s
    environment:
      DB_HOST: mysql
      DB_USER: aiops
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ai_ops
      # Requests reach the backend through Caddy: take the visitor's address
      # from X-Forwarded-For (for the sign-in limits).
      TRUST_PROXY: 1
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      APP_URL: https://${DOMAIN}
      DASHBOARD_URL: https://${DOMAIN}
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY:-}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET:-}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      # Only read when AI_API_KEY is blank (DeepSeek).
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Blank means the defaults (50 runs per account, 200 in total, per 24 hours).
      AGENT_DAILY_LIMIT_PER_ACCOUNT: ${AGENT_DAILY_LIMIT_PER_ACCOUNT:-}
      AGENT_DAILY_LIMIT_TOTAL: ${AGENT_DAILY_LIMIT_TOTAL:-}
      CHAT_DAILY_LIMIT_PER_ACCOUNT: ${CHAT_DAILY_LIMIT_PER_ACCOUNT:-}
      CHAT_DAILY_LIMIT_TOTAL: ${CHAT_DAILY_LIMIT_TOTAL:-}
      PRIVACY_OPERATOR: ${PRIVACY_OPERATOR:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      OPS_ALERT_TELEGRAM_CHAT_ID: ${OPS_ALERT_TELEGRAM_CHAT_ID:-}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Not left blank: the backend reads a blank value as 0, which turns the sync off.
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      # The same for the daily summary and late-order check.
      REPORT_CHECK_MINUTES: ${REPORT_CHECK_MINUTES:-5}
      # Blank means the defaults (on, 4 hours, 200 at once).
      DEMO_ENABLED: ${DEMO_ENABLED:-}
      DEMO_HOURS: ${DEMO_HOURS:-}
      DEMO_MAX_ACTIVE: ${DEMO_MAX_ACTIVE:-}
    depends_on:
      mysql:
        condition: service_healthy
    logging: *logging

  dashboard:
    build:
      context: ../dashboard
      args:
        BACKEND_URL: http://backend:3000
    restart: unless-stopped
    depends_on:
      - backend
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      # Second tenant on this server (AI Hub). Unset is safe: the site binds to
      # localhost rather than failing a public certificate request. Defaulted
      # here too, because an empty value is not the same as an absent one.
      AIHUB_DOMAIN: ${AIHUB_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep this volume, or Caddy asks for new ones
      - caddy-config:/config
    depends_on:
      - backend
      - dashboard
    networks:
      - default
      - edge
    logging: *logging

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

networks:
  # Shared with other stacks on this host so Caddy can reach their containers.
  # Create it once: docker network create edge
  edge:
    external: true
